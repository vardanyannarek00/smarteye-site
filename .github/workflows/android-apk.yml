name: Price Manager app (Android)

on:
  push:
    branches: [main]
    paths:
      # build only when a new app version is released (bump app/VERSION)
      - "app/VERSION"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: |
          rm -rf www
          cp -R ../tools/calc-app www
          rm -f www/.htaccess
          cp node_modules/@capacitor/core/dist/capacitor.js www/vendor/capacitor.js
          # load Capacitor core before the app scripts
          sed -i 's#<script src="vendor/supabase.js"></script>#<script src="vendor/capacitor.js"></script>\n<script src="vendor/supabase.js"></script>#' www/index.html
          grep -q 'vendor/capacitor.js' www/index.html

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android
          # native plugin: send the PDF straight to Telegram / Viber / WhatsApp
          J=android/app/src/main/java/am/smarteye/pricemanager
          test -f $J/MainActivity.java
          cp native/DirectSharePlugin.java native/MainActivity.java $J/

      - name: App icon and splash
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#ffffff' --splashBackgroundColor '#07122b' --splashBackgroundColorDark '#07122b'

      - name: Version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"$/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add repository secret ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"; exit 1; fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*-unsigned.apk | head -1)
          # the signing key lives in the repo encrypted; the secret is its password
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in release.jks.enc -out release.jks -pass env:KS_PASS
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias pricemanager --out SmartEye-PriceManager.apk aligned.apk
          "$BT/apksigner" verify SmartEye-PriceManager.apk
          rm -f release.jks
          ls -la SmartEye-PriceManager.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app/SmartEye-PriceManager.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -la out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pm-v1.0.${{ github.run_number }}
          name: Price Manager 1.0.${{ github.run_number }}
          body: |
            SmartEye Price Manager
            - Android: https://github.com/${{ github.repository }}/releases/latest/download/SmartEye-PriceManager.apk
            - Համակարգչում՝ https://smarteye.am/calc (բրաուզերով)
          files: |
            out/SmartEye-PriceManager.apk
          fail_on_unmatched_files: false
          make_latest: true
